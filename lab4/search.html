<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTBIN — Подбор игроков</title>
    <link rel="stylesheet" href="style.css">
    <script src="search.js" defer></script>
</head>
<body>
    <h1 id="logo">FUTBIN</h1>
    <nav class="menu">
        <a class="menu__link" href="index.html">Главная</a>
        <a class="menu__link" href="players.html">Игроки</a>
        <a class="menu__link" href="squads.html">Составы</a>
        <a class="menu__link menu__link_active" href="search.html" aria-current="page">Подбор игроков</a>
    </nav>
    <h2>Подбор игроков</h2>
    <form class="search" id="search">
        <label for="player">Имя игрока</label>
        <input class="search__field" id="player" name="player" type="text" required maxlength="60">

        <label for="rating">Минимальный рейтинг</label>
        <input class="search__field" id="rating" name="rating" type="number" min="1" max="99" required>

        <label for="position">Позиция</label>
        <select class="search__field" id="position" name="position" required>
            <option value="">Выбери позицию</option>
            <option>Вратарь</option>
            <option>Защитник</option>
            <option>Полузащитник</option>
            <option>Нападающий</option>
        </select>

        <button class="search__button" type="submit">Отправить запрос</button>
    </form>
</body>
</html>
